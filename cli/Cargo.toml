[package]
name = "librorum-cli"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "VDFS command line interface"

[dependencies]
tonic = "0.10"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
dirs = "5.0"
toml = "0.8"
librorum-core = { path = "../core" }
chrono = "0.4"

[build-dependencies]
tonic-build = "0.10" 