[package]
name = "librorum-core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "VDFS core implementation"

[dependencies]
tonic = "0.10"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
dirs = "5.0"
notify = "6.0"
uuid = { version = "1.0", features = ["v4"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0"
toml = "0.8"
num_cpus = "1.16"

[build-dependencies]
tonic-build = "0.10"

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.8" 