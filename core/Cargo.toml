[package]
name = "librorum-core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "VDFS core implementation"

[dependencies]
tonic = "0.11.0"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0.40"
anyhow = "1.0"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-appender = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
dirs = "5.0"
notify = "6.0"
uuid = { version = "1.3.3", features = ["v4", "serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
chrono = "0.4"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1.0"
toml = "0.8.12"
num_cpus = "1.0"
socket2 = "0.5"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
futures-util = "0.3"
nanoid = "0.4"
hostname = "0.3"
lazy_static = "1.4.0"
daemonize = { version = "0.5.0", optional = true }
windows-service = { version = "0.8.0", optional = true }
libc = "0.2"
glob = "0.3"

[build-dependencies]
tonic-build = "0.11.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "librorum"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.8"
futures-util = "0.3"
tokio-test = "0.4"
tokio = { version = "1.0", features = ["full", "test-util"] }
assert_matches = "1.5"
pretty_assertions = "1.4"

[features]
daemon-unix = ["daemonize"]
windows_service = ["windows-service"]
default = []

[target.'cfg(not(windows))'.dependencies]
daemonize = { version = "0.5.0" }

[target.'cfg(windows)'.dependencies]
windows-service = { version = "0.8.0" }
